<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">EnergyBuddy core user flow</title>
  <desc id="desc">A six-step user journey from a quick check-in to a safer updated forecast.</desc>
  <rect width="1500" height="520" rx="32" fill="#eef5f4"/>
  <text x="58" y="63" font-family="Arial" font-size="30" font-weight="700" fill="#123f4a">Core user flow: from signal to safer schedule</text>
  <text x="58" y="94" font-family="Arial" font-size="16" fill="#61797e">One continuous journey; no diagnosis, guilt or productivity scoring.</text>
  <g stroke="#8ea8aa" stroke-width="3" fill="none">
    <path d="M250 270 L310 270"/><path d="M490 270 L550 270"/><path d="M730 270 L790 270"/><path d="M970 270 L1030 270"/><path d="M1210 270 L1270 270"/>
  </g>
  <g fill="#d7ff68">
    <path d="M304 263 L318 270 L304 277Z"/><path d="M544 263 L558 270 L544 277Z"/><path d="M784 263 L798 270 L784 277Z"/><path d="M1024 263 L1038 270 L1024 277Z"/><path d="M1264 263 L1278 270 L1264 277Z"/>
  </g>
  <g font-family="Arial">
    <g><rect x="70" y="180" width="180" height="180" rx="26" fill="#fff" stroke="#c9dad7" stroke-width="2"/><circle cx="160" cy="224" r="24" fill="#e4f7f1"/><text x="160" y="231" text-anchor="middle" font-size="22">①</text><text x="160" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#123f4a">Check in</text><text x="160" y="304" text-anchor="middle" font-size="14" fill="#60777c">Energy, sleep</text><text x="160" y="325" text-anchor="middle" font-size="14" fill="#60777c">and stress</text></g>
    <g><rect x="310" y="180" width="180" height="180" rx="26" fill="#fff" stroke="#c9dad7" stroke-width="2"/><circle cx="400" cy="224" r="24" fill="#eeeaff"/><text x="400" y="231" text-anchor="middle" font-size="22">②</text><text x="400" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#123f4a">See batteries</text><text x="400" y="304" text-anchor="middle" font-size="14" fill="#60777c">Mental, physical</text><text x="400" y="325" text-anchor="middle" font-size="14" fill="#60777c">and social</text></g>
    <g><rect x="550" y="180" width="180" height="180" rx="26" fill="#fff" stroke="#c9dad7" stroke-width="2"/><circle cx="640" cy="224" r="24" fill="#fff0e5"/><text x="640" y="231" text-anchor="middle" font-size="22">③</text><text x="640" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#123f4a">Spot storm</text><text x="640" y="304" text-anchor="middle" font-size="14" fill="#60777c">Thursday ends</text><text x="640" y="325" text-anchor="middle" font-size="14" fill="#60777c">at 7%</text></g>
    <g><rect x="790" y="180" width="180" height="180" rx="26" fill="#123f4a"/><circle cx="880" cy="224" r="24" fill="#d7ff68"/><text x="880" y="231" text-anchor="middle" font-size="22" fill="#123f4a">④</text><text x="880" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="white">Understand why</text><text x="880" y="304" text-anchor="middle" font-size="14" fill="#bdd1cf">Deep work + shift</text><text x="880" y="325" text-anchor="middle" font-size="14" fill="#bdd1cf">without recovery</text></g>
    <g><rect x="1030" y="180" width="180" height="180" rx="26" fill="#fff" stroke="#c9dad7" stroke-width="2"/><circle cx="1120" cy="224" r="24" fill="#e4f7f1"/><text x="1120" y="231" text-anchor="middle" font-size="22">⑤</text><text x="1120" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#123f4a">Try changes</text><text x="1120" y="304" text-anchor="middle" font-size="14" fill="#60777c">Split, move</text><text x="1120" y="325" text-anchor="middle" font-size="14" fill="#60777c">and recover</text></g>
    <g><rect x="1270" y="180" width="180" height="180" rx="26" fill="#fff" stroke="#74bea9" stroke-width="3"/><circle cx="1360" cy="224" r="24" fill="#d7ff68"/><text x="1360" y="231" text-anchor="middle" font-size="22">⑥</text><text x="1360" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#123f4a">Apply plan</text><text x="1360" y="304" text-anchor="middle" font-size="14" fill="#60777c">Cloudy, with</text><text x="1360" y="325" text-anchor="middle" font-size="14" fill="#60777c">31% remaining</text></g>
    <rect x="510" y="410" width="480" height="52" rx="16" fill="#fff" stroke="#cedddb"/>
    <text x="750" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#31545b">Visible impact: +24% reserve without removing an essential commitment</text>
  </g>
</svg>
