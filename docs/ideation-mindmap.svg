<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">EnergyBuddy ideation mindmap</title>
  <desc id="desc">A multi-layered mindmap connecting student burnout causes, signals, ideas, actions and intended outcomes.</desc>
  <rect width="1400" height="820" rx="32" fill="#eef5f4"/>
  <text x="58" y="64" fill="#123f4a" font-family="Arial" font-size="30" font-weight="700">From invisible overload to an actionable forecast</text>
  <text x="58" y="96" fill="#61797e" font-family="Arial" font-size="16">Ideation mindmap · EnergyBuddy</text>
  <g fill="none" stroke="#8aa4a7" stroke-width="3">
    <path d="M700 390 C560 390 520 220 410 220"/><path d="M700 390 C560 390 520 570 410 570"/>
    <path d="M700 390 C840 390 880 220 990 220"/><path d="M700 390 C840 390 880 570 990 570"/>
    <path d="M410 220 C315 220 300 160 220 160"/><path d="M410 220 C315 220 300 230 220 230"/><path d="M410 220 C315 220 300 300 220 300"/>
    <path d="M410 570 C315 570 300 500 220 500"/><path d="M410 570 C315 570 300 570 220 570"/><path d="M410 570 C315 570 300 640 220 640"/>
    <path d="M990 220 C1085 220 1100 150 1180 150"/><path d="M990 220 C1085 220 1100 220 1180 220"/><path d="M990 220 C1085 220 1100 290 1180 290"/>
    <path d="M990 570 C1085 570 1100 500 1180 500"/><path d="M990 570 C1085 570 1100 570 1180 570"/><path d="M990 570 C1085 570 1100 640 1180 640"/>
  </g>
  <g font-family="Arial">
    <rect x="570" y="330" width="260" height="120" rx="28" fill="#123f4a"/>
    <text x="700" y="378" text-anchor="middle" fill="#d7ff68" font-size="27" font-weight="700">EnergyBuddy</text>
    <text x="700" y="408" text-anchor="middle" fill="#d1e2e0" font-size="16">Forecast → explain → rebalance</text>

    <rect x="315" y="180" width="190" height="80" rx="22" fill="#7557ff"/><text x="410" y="212" text-anchor="middle" fill="white" font-size="20" font-weight="700">Causes</text><text x="410" y="238" text-anchor="middle" fill="#eeeaff" font-size="14">What piles up?</text>
    <rect x="315" y="530" width="190" height="80" rx="22" fill="#f28b43"/><text x="410" y="562" text-anchor="middle" fill="white" font-size="20" font-weight="700">Signals</text><text x="410" y="588" text-anchor="middle" fill="#fff0e5" font-size="14">What can we notice?</text>
    <rect x="895" y="180" width="190" height="80" rx="22" fill="#1b9f82"/><text x="990" y="212" text-anchor="middle" fill="white" font-size="20" font-weight="700">Interventions</text><text x="990" y="238" text-anchor="middle" fill="#e5f7f1" font-size="14">What changes the week?</text>
    <rect x="895" y="530" width="190" height="80" rx="22" fill="#d7ff68"/><text x="990" y="562" text-anchor="middle" fill="#123f4a" font-size="20" font-weight="700">Outcomes</text><text x="990" y="588" text-anchor="middle" fill="#38565d" font-size="14">What improves?</text>

    <g fill="#fff" stroke="#cbdad8" stroke-width="2">
      <rect x="80" y="132" width="150" height="55" rx="15"/><rect x="80" y="202" width="150" height="55" rx="15"/><rect x="80" y="272" width="150" height="55" rx="15"/>
      <rect x="80" y="472" width="150" height="55" rx="15"/><rect x="80" y="542" width="150" height="55" rx="15"/><rect x="80" y="612" width="150" height="55" rx="15"/>
      <rect x="1170" y="122" width="170" height="55" rx="15"/><rect x="1170" y="192" width="170" height="55" rx="15"/><rect x="1170" y="262" width="170" height="55" rx="15"/>
      <rect x="1170" y="472" width="170" height="55" rx="15"/><rect x="1170" y="542" width="170" height="55" rx="15"/><rect x="1170" y="612" width="170" height="55" rx="15"/>
    </g>
    <g fill="#294850" font-size="15" font-weight="600" text-anchor="middle">
      <text x="155" y="166">Clashing deadlines</text><text x="155" y="236">Part-time work</text><text x="155" y="306">Invisible errands</text>
      <text x="155" y="506">Short sleep</text><text x="155" y="576">Stress check-ins</text><text x="155" y="646">Missed recovery</text>
      <text x="1255" y="156">Energy batteries</text><text x="1255" y="226">Weather forecast</text><text x="1255" y="296">What-if planner</text>
      <text x="1255" y="506">Earlier awareness</text><text x="1255" y="576">Safer workload</text><text x="1255" y="646">Guilt-free recovery</text>
    </g>
  </g>
  <g font-family="Arial" font-size="14" fill="#587176">
    <rect x="500" y="706" width="400" height="62" rx="18" fill="#fff" stroke="#cedddb" stroke-width="2"/>
    <text x="700" y="732" text-anchor="middle" font-weight="700" fill="#123f4a">Core insight</text>
    <text x="700" y="754" text-anchor="middle">Calendars measure time. Students experience workload as energy.</text>
  </g>
</svg>
